name: Deploy Services to VM (Daily Sync & Manual)

# Runs 10 min AFTER the tradingbot-tools deploy (03:45 UTC) so the auditor
# package is already on the VM and the timer can be enabled the same night.
# It still runs after tradingbot-bots (03:00 UTC), which the auditor imports from.
on:
  schedule:
    # Mon-Fri at 03:55 UTC (10 min after the tools deploy at 03:45 UTC)
    - cron: '55 3 * * 2-6'
  repository_dispatch:
    types: [services-paths-changed]  # triggered by bots deploy when ExecStart paths change
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm (required for manual, auto-filled for scheduled)'
        required: false
        default: ''

env:
  VM_USER: i030983
  SERVICES_PATH: /home/i030983/tradingbots/services

jobs:
  check-and-validate:
    name: Validate & Check Changes
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Validate trigger
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
              echo "❌ Manual deployment cancelled - type 'deploy' to confirm"
              exit 1
            fi
            echo "✅ Manual deployment confirmed"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "✅ Scheduled daily sync — auto-approved"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "✅ Cross-repo dispatch (services-paths-changed) — auto-approved"
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.VM_HOST }}" ]; then
            echo "::error::secret VM_HOST is not set for this repository"
            exit 1
          fi
          if [ -z "${{ secrets.VM_SSH_KEY }}" ]; then
            echo "::error::secret VM_SSH_KEY is not set for this repository"
            exit 1
          fi
          echo "secrets present"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Check for changes since last deploy
        id: check
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "🔔 Cross-repo dispatch — always deploy to re-validate paths"
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "🔧 Manual trigger — always deploy"
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Scheduled run: check if service files changed since last deploy
          DEPLOYED_COMMIT=$(ssh -o ConnectTimeout=10 ${{ env.VM_USER }}@${{ secrets.VM_HOST }} "cat \$HOME/systemd-backups/latest_deployed_services_commit.txt 2>/dev/null || echo 'none'")
          DEPLOYED_COMMIT=$(echo "$DEPLOYED_COMMIT" | tr -d '[:space:]')
          CURRENT_COMMIT="${{ github.sha }}"

          echo "Last deployed services commit: $DEPLOYED_COMMIT"
          echo "Current main branch commit:    $CURRENT_COMMIT"

          if [ "$DEPLOYED_COMMIT" = "$CURRENT_COMMIT" ]; then
            echo "✅ Services on VM are up-to-date. No changes to deploy."
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if only non-service files changed (README, scripts, etc.)
          if [ "$DEPLOYED_COMMIT" != "none" ] && git rev-parse "$DEPLOYED_COMMIT" >/dev/null 2>&1; then
            CHANGED_SERVICES=$(git diff --name-only "$DEPLOYED_COMMIT" "$CURRENT_COMMIT" -- '*.service' '*.timer' | wc -l)
            if [ "$CHANGED_SERVICES" -eq 0 ]; then
              echo "✅ No .service/.timer file changes since last deploy. Skipping."
              echo "should_deploy=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "🔍 Service/timer file changes detected. Proceeding to deploy."
          echo "should_deploy=true" >> $GITHUB_OUTPUT

      - name: Cross-repo path validation (ExecStart targets)
        if: steps.check.outputs.should_deploy == 'true'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔗 Cross-Repo Path Validation"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          ERRORS=0
          for svc in *.service; do
            [ -f "$svc" ] || continue
            # Extract ExecStart and ExecStop paths (skip /usr/bin system binaries)
            for directive in ExecStart ExecStop ExecStartPre; do
              while IFS= read -r line; do
                EXEC_PATH=$(echo "$line" | sed 's/^[^=]*=//' | awk '{print $1}')
                # Skip system binaries and flock
                case "$EXEC_PATH" in
                  /usr/bin/*|/bin/*) continue ;;
                esac
                echo "  Checking $svc → $directive → $EXEC_PATH"
                if ! ssh -o ConnectTimeout=10 ${{ env.VM_USER }}@${{ secrets.VM_HOST }} "test -f '$EXEC_PATH' || test -d '$EXEC_PATH'" 2>/dev/null; then
                  echo "  ❌ MISSING on VM: $EXEC_PATH (referenced by $svc)"
                  ERRORS=$((ERRORS + 1))
                else
                  echo "  ✅ exists"
                fi
              done < <(grep "^${directive}=" "$svc" 2>/dev/null || true)
            done
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo ""
            echo "⚠️  $ERRORS ExecStart/ExecStop path(s) missing on VM."
            echo "    The bots repo may not have deployed yet, or a script was renamed."
            echo "    Proceeding with deploy — but the affected services may fail to start."
          else
            echo ""
            echo "✅ All ExecStart/ExecStop paths verified on VM"
          fi

  deploy:
    name: Deploy Services
    needs: check-and-validate
    if: needs.check-and-validate.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.VM_HOST }}" ]; then
            echo "::error::secret VM_HOST is not set for this repository"
            exit 1
          fi
          if [ -z "${{ secrets.VM_SSH_KEY }}" ]; then
            echo "::error::secret VM_SSH_KEY is not set for this repository"
            exit 1
          fi
          echo "secrets present"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Validate service files exist
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 Service Files to Deploy:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          SERVICE_COUNT=$(ls -1 *.service 2>/dev/null | wc -l)
          TIMER_COUNT=$(ls -1 *.timer 2>/dev/null | wc -l)

          if [ "$SERVICE_COUNT" -eq 0 ] && [ "$TIMER_COUNT" -eq 0 ]; then
            echo "❌ No service or timer files found in repository root"
            exit 1
          fi

          echo ""
          echo "Services (*.service):"
          ls -lh *.service 2>/dev/null || echo "  None"

          echo ""
          echo "Timers (*.timer):"
          ls -lh *.timer 2>/dev/null || echo "  None"

          echo ""
          echo "Total: $SERVICE_COUNT service(s), $TIMER_COUNT timer(s)"
          echo "Destination: /etc/systemd/system/"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Backup current service files on VM
        run: |
          ssh ${{ env.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            BACKUP_DIR="$HOME/systemd-backups/backup-$(date +%Y%m%d-%H%M%S)"
            mkdir -p "$BACKUP_DIR"

            # Backup existing service files
            sudo cp /etc/systemd/system/trading-bot-*.service "$BACKUP_DIR/" 2>/dev/null || true
            sudo cp /etc/systemd/system/trading-bot-*.timer "$BACKUP_DIR/" 2>/dev/null || true
            sudo cp /etc/systemd/system/bot-control-api.service "$BACKUP_DIR/" 2>/dev/null || true

            echo "✅ Backup created: $BACKUP_DIR"

            # Keep only last 5 backups
            ls -dt $HOME/systemd-backups/backup-* | tail -n +6 | xargs rm -rf
          EOF

      - name: Upload service files to VM (systemd files only)
        run: |
          # Only upload .service and .timer files (exclude everything else)
          SERVICE_FILES=$(ls *.service 2>/dev/null || echo "")
          TIMER_FILES=$(ls *.timer 2>/dev/null || echo "")

          if [ -n "$SERVICE_FILES" ]; then
            scp $SERVICE_FILES ${{ env.VM_USER }}@${{ secrets.VM_HOST }}:/tmp/
            echo "✅ Uploaded service files: $SERVICE_FILES"
          fi

          if [ -n "$TIMER_FILES" ]; then
            scp $TIMER_FILES ${{ env.VM_USER }}@${{ secrets.VM_HOST }}:/tmp/
            echo "✅ Uploaded timer files: $TIMER_FILES"
          fi

          echo ""
          echo "📋 Files NOT uploaded (excluded):"
          echo "  ❌ Tests, docs, README.md, scripts, etc."
          echo "  ✅ Only systemd unit files deployed"

      - name: Compute dynamic timer schedule from bot configs
        run: |
          ssh ${{ env.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            echo "Computing timer schedule from bot configs..."
            cd /home/i030983/tradingbots
            python3 scripts/generate_timer_schedule.py \
              --bot-configs-dir config/bots \
              --output-dir /tmp
            echo "✅ Timer files updated based on bot configs"
          EOF

      - name: Install service files (requires sudo)
        run: |
          ssh ${{ env.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            echo "Installing systemd service files..."

            # Copy service files to systemd directory
            sudo cp /tmp/*.service /etc/systemd/system/ 2>/dev/null || true
            sudo cp /tmp/*.timer /etc/systemd/system/ 2>/dev/null || true

            # Set proper ownership and permissions
            sudo chown root:root /etc/systemd/system/trading-bot-*.service 2>/dev/null || true
            sudo chown root:root /etc/systemd/system/trading-bot-*.timer 2>/dev/null || true
            sudo chown root:root /etc/systemd/system/bot-control-api.service 2>/dev/null || true
            sudo chmod 644 /etc/systemd/system/trading-bot-*.service 2>/dev/null || true
            sudo chmod 644 /etc/systemd/system/trading-bot-*.timer 2>/dev/null || true
            sudo chmod 644 /etc/systemd/system/bot-control-api.service 2>/dev/null || true

            # Clean up temp files
            rm /tmp/*.service /tmp/*.timer 2>/dev/null || true

            echo "✅ Service files installed"
          EOF

      - name: Reload systemd daemon
        run: |
          ssh ${{ env.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            echo "Reloading systemd daemon..."
            sudo systemctl daemon-reload
            echo "✅ Systemd daemon reloaded"
          EOF

      - name: Enable and restart timers
        run: |
          ssh ${{ env.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            echo "Enabling and restarting timers..."
            sudo systemctl enable --now trading-bot-manager-start.timer
            sudo systemctl enable --now trading-bot-manager-stop.timer
            # Only enable the auditor timer once its code is actually on the VM.
            # This workflow ships only units; the auditor code arrives via
            # tradingbot-tools' own deploy-tools.yml (23:45 ET nightly). Enabling
            # unconditionally would queue a unit whose ExecStartPre fails every
            # afternoon. This workflow is scheduled at 23:55 ET, 10 min AFTER the
            # tools deploy, so the package is normally already present and the timer
            # comes up the same night. The check stays as a guard: if a tools deploy
            # was skipped or failed, skip the timer and say so rather than arming a
            # unit that would fail all afternoon.
            if [ -d /home/i030983/tradingbot-tools/auditor ]; then
              sudo systemctl enable --now trade-log-auditor.timer
              echo "✅ trade-log-auditor.timer enabled (auditor package present)"
            else
              echo "⚠️  /home/i030983/tradingbot-tools/auditor not found - skipping"
              echo "    trade-log-auditor.timer. Deploy tradingbot-tools to the VM first."
            fi
            echo "✅ Timers enabled and active"
            echo ""
            echo "⏰ Start timer next fire:"
            systemctl show trading-bot-manager-start.timer --property=NextElapseUSecRealtime --value
            echo "⏰ Stop timer next fire:"
            systemctl show trading-bot-manager-stop.timer --property=NextElapseUSecRealtime --value
            echo "⏰ Auditor timer next fire:"
            systemctl show trade-log-auditor.timer --property=NextElapseUSecRealtime --value || true
          EOF

      - name: Show service status
        run: |
          ssh ${{ env.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📊 Service Status"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            echo ""
            echo "🤖 Trading Bot Manager:"
            sudo systemctl status trading-bot-manager.service --no-pager -l || true

            echo ""
            echo "⏰ Start Timer:"
            sudo systemctl status trading-bot-manager-start.timer --no-pager -l || true

            echo ""
            echo "⏰ Stop Timer:"
            sudo systemctl status trading-bot-manager-stop.timer --no-pager -l || true

            echo ""
            echo "🌐 Bot Control API:"
            sudo systemctl status bot-control-api.service --no-pager -l || true

            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          EOF

      - name: Deployment summary
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ SERVICE DEPLOYMENT COMPLETE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📝 Next Steps:"
          echo ""
          echo "1. Review service status above"
          echo "2. If services need restart:"
          echo "   sudo systemctl restart trading-bot-manager"
          echo ""
          echo "3. Enable timers if not already enabled:"
          echo "   sudo systemctl enable --now trading-bot-manager-start.timer"
          echo "   sudo systemctl enable --now trading-bot-manager-stop.timer"
          echo ""
          echo "4. View logs:"
          echo "   sudo journalctl -u trading-bot-manager -f"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Create deployment record
        run: |
          ssh ${{ env.VM_USER }}@${{ secrets.VM_HOST }} << EOF
            mkdir -p \$HOME/systemd-backups
            echo "${{ github.sha }}" > \$HOME/systemd-backups/latest_deployed_services_commit.txt
            RECORD_FILE="\$HOME/systemd-deployments.log"
            echo "\$(date -u +%Y-%m-%dT%H:%M:%SZ) commit=${{ github.sha }} — deployed via ${{ github.event_name }}" >> "\$RECORD_FILE"
            echo "✅ Deployment recorded (commit: ${{ github.sha }})"
          EOF
