name: Deploy Services to VM (Daily Sync & Manual)

# GitHub Actions cron is always UTC; it does not follow DST. The fixed 03:55 UTC
# slot is 23:55 America/New_York during EDT (UTC-4) and 22:55 during EST (UTC-5,
# on the preceding ET day) — the local wall time drifts one hour at each transition.
# Runs 10 min AFTER the tradingbot-tools deploy (03:45 UTC) so the auditor
# package is already on the VM and the timer can be enabled the same night.
# It still runs after tradingbot-bots (03:00 UTC), which the auditor imports from.
on:
  schedule:
    # Tue-Sat 03:55 UTC = Mon-Fri 23:55 EDT (UTC-4) in summer, or Mon-Fri 22:55 EST
    # (UTC-5) in winter. The UTC weekday is one day ahead; the ET wall time drifts
    # by one hour at DST changes.
    - cron: '55 3 * * 2-6'
  repository_dispatch:
    types: [services-paths-changed]  # triggered by bots deploy when ExecStart paths change
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm (required for manual, auto-filled for scheduled)'
        required: false
        default: ''

env:
  VM_USER: i030983
  SERVICES_PATH: /home/i030983/tradingbots/services

jobs:
  check-and-validate:
    name: Validate & Check Changes
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Validate trigger
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
              echo "❌ Manual deployment cancelled - type 'deploy' to confirm"
              exit 1
            fi
            echo "✅ Manual deployment confirmed"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "✅ Scheduled daily sync — auto-approved"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "✅ Cross-repo dispatch (services-paths-changed) — auto-approved"
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert deploy schedule (UTC ↔ America/New_York)
        run: |
          python3 - <<'PY'
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          workflow = Path('.github/workflows/deploy-services.yml').read_text(encoding='utf-8')
          cron = re.search(r"^\s*-\s*cron:\s*'([^']+)'", workflow, re.MULTILINE)
          assert cron and cron.group(1) == '55 3 * * 2-6', 'unexpected services deploy cron'
          for expected in ('03:55 UTC', '23:55 EDT', '22:55 EST', 'DST'):
              assert expected in workflow, f'missing schedule annotation: {expected}'

          now_utc = datetime.now(timezone.utc)
          now_et = now_utc.astimezone(ZoneInfo('America/New_York'))
          print(f'🕒 Trigger now: {now_utc:%Y-%m-%d %H:%M:%S} UTC / '
                f'{now_et:%Y-%m-%d %H:%M:%S %Z} (America/New_York)')
          for month, label in ((7, 'EDT'), (1, 'EST')):
              instant = datetime(2026, month, 7, 3, 55, tzinfo=timezone.utc)
              local = instant.astimezone(ZoneInfo('America/New_York'))
              print(f'🕒 Scheduled 03:55 UTC ({label} sample): {local:%Y-%m-%d %H:%M %Z} '
                    f'(UTC{local:%z})')
          print('✅ Schedule assertion: cron 55 3 * * 2-6 = 23:55 EDT / 22:55 EST ET')
          PY

      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.VM_HOST }}" ]; then
            echo "::error::secret VM_HOST is not set for this repository"
            exit 1
          fi
          if [ -z "${{ secrets.VM_SSH_KEY }}" ]; then
            echo "::error::secret VM_SSH_KEY is not set for this repository"
            exit 1
          fi
          echo "secrets present"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Check for changes since last deploy
        id: check
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "🔔 Cross-repo dispatch — always deploy to re-validate paths"
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "🔧 Manual trigger — always deploy"
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Scheduled run: check if service files changed since last deploy
          DEPLOYED_COMMIT=$(ssh -o ConnectTimeout=10 ${{ env.VM_USER }}@${{ secrets.VM_HOST }} "cat \$HOME/backups/services/latest_deployed_services_commit.txt 2>/dev/null || cat \$HOME/systemd-backups/latest_deployed_services_commit.txt 2>/dev/null || echo 'none'")
          DEPLOYED_COMMIT=$(echo "$DEPLOYED_COMMIT" | tr -d '[:space:]')
          CURRENT_COMMIT="${{ github.sha }}"

          echo "Last deployed services commit: $DEPLOYED_COMMIT"
          echo "Current main branch commit:    $CURRENT_COMMIT"

          if [ "$DEPLOYED_COMMIT" = "$CURRENT_COMMIT" ]; then
            echo "✅ Services on VM are up-to-date. No changes to deploy."
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if only non-service files changed (README, docs, etc.)
          # scripts/ counts as deployable: the health check, cron wrapper and
          # systemd failure hook live there and must reach the VM.
          if [ "$DEPLOYED_COMMIT" != "none" ] && git rev-parse "$DEPLOYED_COMMIT" >/dev/null 2>&1; then
            CHANGED_SERVICES=$(git diff --name-only "$DEPLOYED_COMMIT" "$CURRENT_COMMIT" -- '*.service' '*.timer' 'scripts/*' '.github/workflows/deploy-services.yml' | wc -l)
            if [ "$CHANGED_SERVICES" -eq 0 ]; then
              echo "✅ No .service/.timer/scripts changes since last deploy. Skipping."
              echo "should_deploy=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "🔍 Service/timer/script changes detected. Proceeding to deploy."
          echo "should_deploy=true" >> $GITHUB_OUTPUT

      - name: Cross-repo path validation (ExecStart targets)
        if: steps.check.outputs.should_deploy == 'true'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔗 Cross-Repo Path Validation"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          ERRORS=0
          for svc in *.service; do
            [ -f "$svc" ] || continue
            # Extract ExecStart and ExecStop paths (skip /usr/bin system binaries)
            for directive in ExecStart ExecStop ExecStartPre; do
              while IFS= read -r line; do
                EXEC_PATH=$(echo "$line" | sed 's/^[^=]*=//' | awk '{print $1}')
                # Skip system binaries and flock
                case "$EXEC_PATH" in
                  /usr/bin/*|/bin/*) continue ;;
                esac
                echo "  Checking $svc → $directive → $EXEC_PATH"
                if ! ssh -o ConnectTimeout=10 ${{ env.VM_USER }}@${{ secrets.VM_HOST }} "test -f '$EXEC_PATH' || test -d '$EXEC_PATH'" 2>/dev/null; then
                  echo "  ❌ MISSING on VM: $EXEC_PATH (referenced by $svc)"
                  ERRORS=$((ERRORS + 1))
                else
                  echo "  ✅ exists"
                fi
              done < <(grep "^${directive}=" "$svc" 2>/dev/null || true)
            done
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo ""
            echo "⚠️  $ERRORS ExecStart/ExecStop path(s) missing on VM."
            echo "    The bots repo may not have deployed yet, or a script was renamed."
            echo "    Proceeding with deploy — but the affected services may fail to start."
          else
            echo ""
            echo "✅ All ExecStart/ExecStop paths verified on VM"
          fi

  deploy:
    name: Deploy Services
    needs: check-and-validate
    if: needs.check-and-validate.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.VM_HOST }}" ]; then
            echo "::error::secret VM_HOST is not set for this repository"
            exit 1
          fi
          if [ -z "${{ secrets.VM_SSH_KEY }}" ]; then
            echo "::error::secret VM_SSH_KEY is not set for this repository"
            exit 1
          fi
          echo "secrets present"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      # Option 3A (Audit F / Issue #497): Acquire atomic lock on the target VM to prevent cross-repo deploy concurrency interleaving
      - name: Acquire VM deploy lock
        run: |
          ssh -o ConnectTimeout=10 ${{ env.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            set -e
            LOCKDIR="$HOME/.deploy.lock"
            OWNER="${{ github.repository }}/${{ github.run_id }}"
            echo "Attempting to acquire VM deploy lock for $OWNER..."
            ACQUIRED=false
            for i in $(seq 1 60); do
              if mkdir "$LOCKDIR" 2>/dev/null; then
                echo "$OWNER" > "$LOCKDIR/owner"
                echo "✅ Acquired VM deploy lock for $OWNER"
                ACQUIRED=true
                break
              fi
              # Check for stale lock (> 30 minutes = 1800s)
              if [ -f "$LOCKDIR/owner" ]; then
                LOCK_MTIME=$(stat -c %Y "$LOCKDIR" 2>/dev/null || stat -f %m "$LOCKDIR" 2>/dev/null || date +%s)
                NOW=$(date +%s)
                AGE=$((NOW - LOCK_MTIME))
                if [ "$AGE" -gt 1800 ]; then
                  echo "⚠️ Stale deploy lock detected (${AGE}s old, held by $(cat "$LOCKDIR/owner" 2>/dev/null || echo 'unknown')). Breaking lock..."
                  rm -rf "$LOCKDIR"
                  continue
                fi
              fi
              echo "⏳ Waiting for VM deploy lock held by $(cat "$LOCKDIR/owner" 2>/dev/null || echo 'unknown') (attempt $i/60)..."
              sleep 5
            done
            if [ "$ACQUIRED" != "true" ]; then
              echo "❌ Timeout waiting to acquire VM deploy lock ($LOCKDIR)"
              exit 1
            fi
          EOF

      - name: Validate service files exist
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 Service Files to Deploy:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          SERVICE_COUNT=$(ls -1 *.service 2>/dev/null | wc -l)
          TIMER_COUNT=$(ls -1 *.timer 2>/dev/null | wc -l)

          if [ "$SERVICE_COUNT" -eq 0 ] && [ "$TIMER_COUNT" -eq 0 ]; then
            echo "❌ No service or timer files found in repository root"
            exit 1
          fi

          echo ""
          echo "Services (*.service):"
          ls -lh *.service 2>/dev/null || echo "  None"

          echo ""
          echo "Timers (*.timer):"
          ls -lh *.timer 2>/dev/null || echo "  None"

          echo ""
          echo "Total: $SERVICE_COUNT service(s), $TIMER_COUNT timer(s)"
          echo "Destination: /etc/systemd/system/"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Backup current service files on VM
        run: |
          ssh ${{ env.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            BACKUP_DIR="$HOME/backups/services/backup-$(date +%Y%m%d-%H%M%S)"
            mkdir -p "$BACKUP_DIR"

            # Backup existing service files
            sudo cp /etc/systemd/system/trading-bot-*.service "$BACKUP_DIR/" 2>/dev/null || true
            sudo cp /etc/systemd/system/trading-bot-*.timer "$BACKUP_DIR/" 2>/dev/null || true
            sudo cp /etc/systemd/system/bot-control-api.service "$BACKUP_DIR/" 2>/dev/null || true
            sudo cp /etc/systemd/system/sentinel-audit.service "$BACKUP_DIR/" 2>/dev/null || true
            sudo cp /etc/systemd/system/sentinel-audit.timer "$BACKUP_DIR/" 2>/dev/null || true

            # Back up the operational scripts that this workflow now ships.
            if [ -d "$HOME/scripts" ]; then
              cp -a "$HOME/scripts" "$BACKUP_DIR/scripts" 2>/dev/null || true
            fi

            echo "✅ Backup created: $BACKUP_DIR"

            # Keep only last 3 backups (FIFO)
            ls -dt $HOME/backups/services/backup-* 2>/dev/null | tail -n +4 | xargs rm -rf || true
          EOF

      - name: Upload service files to VM (systemd files + operational scripts)
        run: |
          # Upload .service/.timer files and the operational scripts/ tree.
          SERVICE_FILES=$(ls *.service 2>/dev/null || echo "")
          TIMER_FILES=$(ls *.timer 2>/dev/null || echo "")

          if [ -n "$SERVICE_FILES" ]; then
            scp $SERVICE_FILES ${{ env.VM_USER }}@${{ secrets.VM_HOST }}:/tmp/
            echo "✅ Uploaded service files: $SERVICE_FILES"
          fi

          if [ -n "$TIMER_FILES" ]; then
            scp $TIMER_FILES ${{ env.VM_USER }}@${{ secrets.VM_HOST }}:/tmp/
            echo "✅ Uploaded timer files: $TIMER_FILES"
          fi

          if [ -d scripts ] && [ -n "$(ls -A scripts 2>/dev/null)" ]; then
            scp -r scripts ${{ env.VM_USER }}@${{ secrets.VM_HOST }}:/tmp/scripts-upload
            echo "✅ Uploaded scripts/: $(ls scripts)"
          fi

          if [ -f tradingbots.logrotate ]; then
            scp tradingbots.logrotate ${{ env.VM_USER }}@${{ secrets.VM_HOST }}:/tmp/
            echo "✅ Uploaded logrotate config: tradingbots.logrotate"
          fi

          echo ""
          echo "📋 Files NOT uploaded (excluded):"
          echo "  ❌ Tests, docs, README.md, etc."
          echo "  ✅ systemd unit files + scripts/ deployed"

      - name: Compute dynamic timer schedule from bot configs
        run: |
          ssh ${{ env.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            echo "Computing timer schedule from bot configs..."
            cd /home/i030983/tradingbots
            python3 scripts/generate_timer_schedule.py \
              --bot-configs-dir config/bots \
              --output-dir /tmp
            echo "✅ Timer files updated based on bot configs"
          EOF

      - name: Install service files (requires sudo)
        run: |
          ssh ${{ env.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            echo "Installing systemd service files..."

            # Copy service files to systemd directory
            sudo cp /tmp/*.service /etc/systemd/system/ 2>/dev/null || true
            sudo cp /tmp/*.timer /etc/systemd/system/ 2>/dev/null || true

            # Set proper ownership and permissions
            sudo chown root:root /etc/systemd/system/trading-bot-*.service 2>/dev/null || true
            sudo chown root:root /etc/systemd/system/trading-bot-*.timer 2>/dev/null || true
            sudo chown root:root /etc/systemd/system/bot-control-api.service 2>/dev/null || true
            sudo chmod 644 /etc/systemd/system/trading-bot-*.service 2>/dev/null || true
            sudo chmod 644 /etc/systemd/system/trading-bot-*.timer 2>/dev/null || true
            sudo chmod 644 /etc/systemd/system/bot-control-api.service 2>/dev/null || true

            # Units whose names are not matched by the globs above.
            for unit in notification-service.service trade-log-auditor.service \
                        trade-log-auditor.timer learning-analysis.service \
                        learning-analysis.timer ops-watchdog.service \
                        ops-watchdog.timer sentinel-audit.service \
                        sentinel-audit.timer "service-failure-notifier@.service"; do
              sudo chown root:root "/etc/systemd/system/$unit" 2>/dev/null || true
              sudo chmod 644 "/etc/systemd/system/$unit" 2>/dev/null || true
            done

            # Clean up temp files
            rm /tmp/*.service /tmp/*.timer 2>/dev/null || true

            # Install the operational scripts. These run from cron and from the
            # systemd failure hook, so they must be executable by i030983.
            if [ -d /tmp/scripts-upload ]; then
              mkdir -p "$HOME/scripts"
              cp -a /tmp/scripts-upload/. "$HOME/scripts/"
              chmod +x "$HOME/scripts"/*.sh 2>/dev/null || true
              rm -rf /tmp/scripts-upload
              echo "✅ Scripts installed: $(ls "$HOME/scripts")"
            fi

            # Install logrotate configuration for trading bot telemetry and logs
            if [ -f /tmp/tradingbots.logrotate ]; then
              sudo cp /tmp/tradingbots.logrotate /etc/logrotate.d/tradingbots
              sudo chown root:root /etc/logrotate.d/tradingbots
              sudo chmod 644 /etc/logrotate.d/tradingbots
              rm -f /tmp/tradingbots.logrotate
              echo "✅ Logrotate policy installed to /etc/logrotate.d/tradingbots"
            fi

            echo "✅ Service files installed"
          EOF

      - name: Reload systemd daemon
        run: |
          ssh ${{ env.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            echo "Reloading systemd daemon..."
            sudo systemctl daemon-reload

            # Validate what was just installed.
            #
            # systemd-analyze verify exits 0 even when it *ignores* an unknown
            # directive, so its output has to be inspected rather than its exit
            # code. Without this, a misplaced directive installs cleanly and
            # silently does nothing -- which is exactly how SuccessExitStatus=
            # ended up ignored under [Unit] instead of [Service] (issue #25).
            # Healthy units produce no output at all.
            PROBLEMS=$(sudo systemd-analyze verify \
              /etc/systemd/system/trading-bot-*.service \
              /etc/systemd/system/trading-bot-*.timer \
              /etc/systemd/system/bot-control-api.service \
              /etc/systemd/system/notification-service.service \
              /etc/systemd/system/trade-log-auditor.service \
              /etc/systemd/system/learning-analysis.service \
              /etc/systemd/system/ops-watchdog.service \
              /etc/systemd/system/ops-watchdog.timer \
              /etc/systemd/system/sentinel-audit.service \
              /etc/systemd/system/sentinel-audit.timer \
              "/etc/systemd/system/service-failure-notifier@.service" 2>&1 \
              | grep -v snapd || true)
            if [ -n "$PROBLEMS" ]; then
              echo "systemd ignored or rejected part of the deployed units:"
              echo "$PROBLEMS"
              exit 1
            fi
            echo "Systemd daemon reloaded; deployed units validated"
          EOF

      - name: Enable and restart timers
        run: |
          ssh ${{ env.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            echo "Enabling and restarting timers..."
            echo "Deploy cron: 03:55 UTC = 23:55 America/New_York (EDT, UTC-4) / 22:55 (EST, UTC-5, preceding ET day)"
            date -u '+Now on VM: %Y-%m-%d %H:%M:%S UTC'
            TZ=America/New_York date '+Now on VM: %Y-%m-%d %H:%M:%S %Z (America/New_York)'
            sudo systemctl enable --now trading-bot-manager-start.timer
            sudo systemctl enable --now trading-bot-manager-stop.timer
            sudo systemctl enable --now ops-watchdog.timer
            sudo systemctl enable --now learning-analysis.timer
            # Only arm the sentinel audit once its token file is provisioned.
            # The dashboard endpoint returns 503 when no token is configured,
            # so an unprovisioned timer would fail every pre-market morning.
            if [ -s /home/i030983/.sentinel_audit ]; then
              sudo systemctl enable --now sentinel-audit.timer
              echo "✅ sentinel-audit.timer enabled (token file present)"
            else
              echo "⚠️  /home/i030983/.sentinel_audit missing - skipping sentinel-audit.timer."
              echo "    Provision the token from Secret Manager (chmod 600), then enable it."
            fi
            # Only enable the auditor timer once its code is actually on the VM.
            # This workflow ships only units; the auditor code arrives via
            # tradingbot-tools' own deploy-tools.yml (03:45 UTC = 23:45 America/New_York
            # during EDT / 22:45 during EST on the preceding ET day). Enabling
            # unconditionally would queue a unit whose ExecStartPre fails every
            # afternoon. This workflow runs at 03:55 UTC (= 23:55 EDT / 22:55 EST),
            # 10 min AFTER the tools deploy, so the package is normally already
            # present and the timer comes up the same night. The check stays as a guard: if a tools deploy
            # was skipped or failed, skip the timer and say so rather than arming a
            # unit that would fail all afternoon.
            if [ -d /home/i030983/tradingbot-tools/auditor ]; then
              sudo systemctl enable --now trade-log-auditor.timer
              echo "✅ trade-log-auditor.timer enabled (auditor package present)"
            else
              echo "⚠️  /home/i030983/tradingbot-tools/auditor not found - skipping"
              echo "    trade-log-auditor.timer. Deploy tradingbot-tools to the VM first."
            fi
            echo "✅ Timers enabled and active"
            echo ""
            echo "⏰ Start timer next fire:"
            systemctl show trading-bot-manager-start.timer --property=NextElapseUSecRealtime --value
            echo "⏰ Stop timer next fire:"
            systemctl show trading-bot-manager-stop.timer --property=NextElapseUSecRealtime --value
            echo "⏰ Ops-watchdog timer next fire:"
            systemctl show ops-watchdog.timer --property=NextElapseUSecRealtime --value || true
            echo "⏰ Learning analysis timer next fire:"
            systemctl show learning-analysis.timer --property=NextElapseUSecRealtime --value || true
            echo "⏰ Sentinel audit timer next fire:"
            systemctl show sentinel-audit.timer --property=NextElapseUSecRealtime --value || true
            echo "⏰ Auditor timer next fire:"
            systemctl show trade-log-auditor.timer --property=NextElapseUSecRealtime --value || true
          EOF

      - name: Show service status
        run: |
          ssh ${{ env.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📊 Service Status"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            echo ""
            echo "🤖 Trading Bot Manager:"
            sudo systemctl status trading-bot-manager.service --no-pager -l || true

            echo ""
            echo "⏰ Start Timer:"
            sudo systemctl status trading-bot-manager-start.timer --no-pager -l || true

            echo ""
            echo "⏰ Stop Timer:"
            sudo systemctl status trading-bot-manager-stop.timer --no-pager -l || true

            echo ""
            echo "🌐 Bot Control API:"
            sudo systemctl status bot-control-api.service --no-pager -l || true

            echo ""
            echo "🛡️ Ops Watchdog Timer:"
            sudo systemctl status ops-watchdog.timer --no-pager -l || true

            echo ""
            echo "🧭 Sentinel Audit Timer:"
            sudo systemctl status sentinel-audit.timer --no-pager -l || true

            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          EOF

      - name: Deployment summary
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ SERVICE DEPLOYMENT COMPLETE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📝 Next Steps:"
          echo ""
          echo "1. Review service status above"
          echo "2. If services need restart:"
          echo "   sudo systemctl restart trading-bot-manager"
          echo ""
          echo "3. Enable timers if not already enabled:"
          echo "   sudo systemctl enable --now trading-bot-manager-start.timer"
          echo "   sudo systemctl enable --now trading-bot-manager-stop.timer"
          echo "   sudo systemctl enable --now sentinel-audit.timer   # after /home/i030983/.sentinel_audit is provisioned"
          echo ""
          echo "4. View logs:"
          echo "   sudo journalctl -u trading-bot-manager -f"
          echo "   sudo journalctl -u sentinel-audit -f"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Create deployment record
        run: |
          ssh ${{ env.VM_USER }}@${{ secrets.VM_HOST }} << EOF
            mkdir -p \$HOME/backups/services \$HOME/logs
            echo "${{ github.sha }}" > \$HOME/backups/services/latest_deployed_services_commit.txt
            RECORD_FILE="\$HOME/logs/systemd-deployments.log"
            echo "\$(date -u +%Y-%m-%dT%H:%M:%SZ) commit=${{ github.sha }} — deployed via ${{ github.event_name }}" >> "\$RECORD_FILE"
            echo "✅ Deployment recorded (commit: ${{ github.sha }})"
          EOF

      # Option 3A (Audit F / Issue #497): Release VM deploy lock regardless of success or failure
      - name: Release VM deploy lock
        if: always()
        run: |
          ssh -o ConnectTimeout=10 ${{ env.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            LOCKDIR="$HOME/.deploy.lock"
            OWNER="${{ github.repository }}/${{ github.run_id }}"
            if [ -d "$LOCKDIR" ]; then
              HELD_BY=$(cat "$LOCKDIR/owner" 2>/dev/null || echo "")
              if [ "$HELD_BY" = "$OWNER" ]; then
                rm -rf "$LOCKDIR"
                echo "✅ Released VM deploy lock for $OWNER"
              else
                echo "ℹ️  Deploy lock held by '$HELD_BY', not releasing for '$OWNER'"
              fi
            fi
          EOF
